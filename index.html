<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حدد يا بطل من الأكبر؟ وساعد الأرنب بالوصول إلى الجزرة!</title>
  <style>
    :root {
      --bg-color: #e0f7fa;
      --primary: #2e7d32;
      --primary-dark: #1b5e20;
      --accent: #ff9800;
      --accent-hover: #f57c00;
      --card-bg: rgba(255, 255, 255, 0.95);
      --text-color: #2c3e50;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background: linear-gradient(135deg, #a8e063 0%, #56ab2f 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      color: var(--text-color);
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 850px;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      border: 4px solid #fff;
      position: relative;
    }

    header {
      text-align: center;
      border-bottom: 2px dashed #a8e063;
      padding-bottom: 12px;
      margin-bottom: 15px;
    }

    .school-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 8px;
    }

    .school-badge {
      background: #e8f5e9;
      color: var(--primary-dark);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.95rem;
      border: 1px solid #c8e6c9;
    }

    .student-input-container {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      padding: 4px 12px;
      border-radius: 20px;
      border: 2px solid #a8e063;
    }

    .student-input-container label {
      font-weight: bold;
      color: var(--primary-dark);
      font-size: 0.9rem;
    }

    .student-input-container input {
      border: none;
      outline: none;
      font-weight: bold;
      color: #333;
      width: 130px;
      font-size: 0.95rem;
    }

    h1 {
      color: #d32f2f;
      font-size: 1.3rem;
      margin-top: 6px;
      line-height: 1.3;
    }

    .game-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      background: #f1f8e9;
      padding: 10px 18px;
      border-radius: 16px;
    }

    .stat-box {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--primary-dark);
    }

    .score-box {
      background: var(--accent);
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      box-shadow: 0 3px 0 #e65100;
    }

    /* Track & Rabbit */
    .track-container {
      position: relative;
      background: linear-gradient(to bottom, #81d4fa 0%, #b2ebf2 60%, #81c784 60%, #4caf50 100%);
      height: 130px;
      border-radius: 16px;
      margin-bottom: 20px;
      overflow: hidden;
      border: 2px solid #81c784;
    }

    .path-dots {
      position: absolute;
      bottom: 22px;
      left: 5%;
      right: 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1;
    }

    .path-dot {
      width: 14px;
      height: 14px;
      background-color: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      border: 2px solid #2e7d32;
      transition: all 0.3s;
    }

    .path-dot.reached {
      background-color: #ffeb3b;
      transform: scale(1.2);
    }

    .rabbit {
      position: absolute;
      bottom: 20px;
      width: 50px;
      height: 50px;
      font-size: 2.5rem;
      line-height: 50px;
      text-align: center;
      transition: left 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 3;
      margin-left: -25px;
      filter: drop-shadow(0 4px 3px rgba(0,0,0,0.3));
    }

    .rabbit.jump {
      animation: rabbitJump 0.6s ease;
    }

    @keyframes rabbitJump {
      0% { transform: translateY(0); }
      50% { transform: translateY(-35px) scale(1.1); }
      100% { transform: translateY(0); }
    }

    .carrot {
      position: absolute;
      bottom: 15px;
      right: 3%;
      font-size: 2.8rem;
      z-index: 2;
      animation: carrotPulse 1.5s infinite ease-in-out;
      filter: drop-shadow(0 4px 3px rgba(0,0,0,0.2));
    }

    @keyframes carrotPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15) rotate(5deg); }
    }

    /* Question Box */
    .question-card {
      background: #ffffff;
      border: 3px solid #c8e6c9;
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 8px 16px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .instruction {
      font-size: 1.1rem;
      font-weight: bold;
      color: #388e3c;
      margin-bottom: 15px;
    }

    .comparison-box {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      direction: ltr; /* Ensure numbers read Left to Right */
      margin: 15px 0;
    }

    .number-display {
      font-size: 1.8rem;
      font-weight: 800;
      color: #1565c0;
      background: #e3f2fd;
      padding: 10px 20px;
      border-radius: 14px;
      border: 2px solid #90caf9;
      min-width: 140px;
      letter-spacing: 1px;
    }

    .circle-holder {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: 3px dashed #ff9800;
      background: #fffde7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: bold;
      color: #e65100;
    }

    /* Action Buttons */
    .choices-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 15px;
      direction: ltr;
    }

    .btn-choice {
      width: 75px;
      height: 65px;
      font-size: 2.2rem;
      font-weight: bold;
      color: white;
      background: linear-gradient(145deg, #ff9800, #f57c00);
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 6px 0 #e65100, 0 8px 15px rgba(0,0,0,0.2);
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-choice:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #e65100;
    }

    .btn-choice:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .feedback-msg {
      height: 30px;
      margin-top: 10px;
      font-size: 1.2rem;
      font-weight: bold;
      transition: all 0.3s;
    }

    .feedback-correct { color: #2e7d32; }
    .feedback-wrong { color: #c62828; }

    /* Sound Control Button */
    .sound-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      background: #fff;
      border: 2px solid #a8e063;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      z-index: 10;
    }

    /* Modal Celebration Screen */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: white;
      width: 90%;
      max-width: 500px;
      border-radius: 28px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      animation: popup 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }

    @keyframes popup {
      0% { transform: scale(0.5); }
      100% { transform: scale(1); }
    }

    .modal-content h2 {
      color: #2e7d32;
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .modal-content p {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: #555;
    }

    .final-score {
      font-size: 2rem;
      font-weight: bold;
      color: #ff9800;
      margin: 15px 0;
      background: #fffde7;
      padding: 10px;
      border-radius: 16px;
      border: 2px dashed #fbc02d;
    }

    .btn-restart {
      background: #2e7d32;
      color: white;
      padding: 12px 30px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 5px 0 #1b5e20;
      transition: all 0.2s;
    }

    .btn-restart:hover {
      background: #388e3c;
    }

    /* Fireworks canvas */
    #fireworks-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      border-radius: 28px;
    }

    @media (max-width: 600px) {
      .number-display {
        font-size: 1.2rem;
        padding: 8px 10px;
        min-width: 100px;
      }
      .circle-holder {
        width: 45px;
        height: 45px;
        font-size: 1.4rem;
      }
      .btn-choice {
        width: 60px;
        height: 55px;
        font-size: 1.8rem;
      }
      h1 {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <button class="sound-btn" id="soundBtn" title="تشغيل / إيقاف الصوت">🔊</button>

    <header>
      <div class="school-info">
        <div class="school-badge">🏫 مدرسة الوجيز النموذجية</div>
        <div class="school-badge">📘 الصف الرابع الأبتدائي</div>
        <div class="student-input-container">
          <label for="studentName">اسم الطالب:</label>
          <input type="text" id="studentName" placeholder="اكتب اسمك هنا" value="بطل الرابع">
        </div>
      </div>
      <h1>🐰🥕 حدد يا بطل من الأكبر؟ وساعد الأرنب بالوصول إلى الجزرة!</h1>
    </header>

    <div class="game-stats">
      <div class="stat-box" id="questionCounter">السؤال 1 من 10</div>
      <div class="stat-box score-box">النتيجة: <span id="scoreDisplay">0</span> ⭐</div>
    </div>

    <!-- Track & Rabbit Animation Area -->
    <div class="track-container" id="trackContainer">
      <div class="path-dots" id="pathDots"></div>
      <div class="rabbit" id="rabbit">🐰</div>
      <div class="carrot">🥕</div>
    </div>

    <!-- Question Area -->
    <div class="question-card">
      <div class="instruction">قارن بين العددين الآتيين واختر الإشارة الصحيحة:</div>
      
      <div class="comparison-box">
        <div class="number-display" id="num1">000000</div>
        <div class="circle-holder" id="choiceHolder">؟</div>
        <div class="number-display" id="num2">000000</div>
      </div>

      <div class="choices-container">
        <button class="btn-choice" onclick="makeChoice('>')">&gt;</button>
        <button class="btn-choice" onclick="makeChoice('=')">=</button>
        <button class="btn-choice" onclick="makeChoice('<')">&lt;</button>
      </div>

      <div class="feedback-msg" id="feedbackMsg"></div>
    </div>
  </div>

  <!-- Final Celebration Screen -->
  <div class="modal-overlay" id="celebrationModal">
    <div class="modal-content">
      <canvas id="fireworks-canvas"></canvas>
      <div style="font-size: 3.5rem; margin-bottom: 10px;">🎉🏆🥕</div>
      <h2>أحسنت يا بطل!</h2>
      <p id="congratsText">لقد ساعدت الأرنب على الوصول إلى الجزرة بنجاح!</p>
      
      <div class="final-score">
        علامتك: <span id="finalScore">10</span> / 10
      </div>

      <button class="btn-restart" onclick="restartGame()">العب مرة أخرى 🔄</button>
    </div>
  </div>

  <script>
    // 10 Grade 4 Jordanian Curriculum Questions (Numbers up to hundreds of thousands, English digits, no commas)
    const questionsData = [
      { num1: 245631, num2: 238745, ans: '>' },
      { num1: 512340, num2: 521430, ans: '<' },
      { num1: 678901, num2: 678901, ans: '=' },
      { num1: 405210, num2: 450120, ans: '<' },
      { num1: 789123, num2: 788999, ans: '>' },
      { num1: 150000, num2: 150000, ans: '=' },
      { num1: 312890, num2: 321000, ans: '<' },
      { num1: 900500, num2: 899999, ans: '>' },
      { num1: 634120, num2: 634120, ans: '=' },
      { num1: 823456, num2: 823546, ans: '<' }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let isSoundEnabled = true;
    let audioCtx = null;

    // Web Audio API Sound Effects Generator
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSound(type) {
      if (!isSoundEnabled) return;
      initAudio();

      if (type === 'correct') {
        // Cheerful Jump & Success Tone
        let now = audioCtx.currentTime;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'wrong') {
        // Soft Gentle Error Tone
        let now = audioCtx.currentTime;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.linearRampToValueAtTime(160, now + 0.3);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);

        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'win') {
        // Fanfare Victory Music
        let notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
        let now = audioCtx.currentTime;
        notes.forEach((freq, i) => {
          let osc = audioCtx.createOscillator();
          let gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.frequency.setValueAtTime(freq, now + i * 0.12);
          gain.gain.setValueAtTime(0.2, now + i * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.4);

          osc.start(now + i * 0.12);
          osc.stop(now + i * 0.12 + 0.4);
        });
      }
    }

    // Toggle Sound Button
    document.getElementById('soundBtn').addEventListener('click', function() {
      isSoundEnabled = !isSoundEnabled;
      this.textContent = isSoundEnabled ? '🔊' : '🔇';
    });

    // Initialize Game Path Dots
    function setupTrack() {
      const dotsContainer = document.getElementById('pathDots');
      dotsContainer.innerHTML = '';
      for (let i = 0; i < questionsData.length; i++) {
        const dot = document.createElement('div');
        dot.className = 'path-dot' + (i === 0 ? ' reached' : '');
        dotsContainer.appendChild(dot);
      }
      updateRabbitPosition(0);
    }

    function updateRabbitPosition(stepIndex) {
      const rabbit = document.getElementById('rabbit');
      const totalSteps = questionsData.length;
      // Calculate percentage along the track (between 5% and 88%)
      const minLeft = 5;
      const maxLeft = 88;
      const currentLeft = minLeft + (stepIndex / (totalSteps - 1)) * (maxLeft - minLeft);
      
      rabbit.style.left = `${currentLeft}%`;

      // Update Dots Highlight
      const dots = document.querySelectorAll('.path-dot');
      dots.forEach((dot, idx) => {
        if (idx <= stepIndex) {
          dot.classList.add('reached');
        } else {
          dot.classList.remove('reached');
        }
      });
    }

    function loadQuestion() {
      const q = questionsData[currentQuestionIndex];
      document.getElementById('num1').textContent = q.num1;
      document.getElementById('num2').textContent = q.num2;
      document.getElementById('choiceHolder').textContent = '؟';
      document.getElementById('feedbackMsg').textContent = '';
      document.getElementById('questionCounter').textContent = `السؤال ${currentQuestionIndex + 1} من ${questionsData.length}`;
      
      // Enable buttons
      const btns = document.querySelectorAll('.btn-choice');
      btns.forEach(btn => btn.disabled = false);
    }

    function makeChoice(symbol) {
      const q = questionsData[currentQuestionIndex];
      const btns = document.querySelectorAll('.btn-choice');
      btns.forEach(btn => btn.disabled = true); // Disable during transition

      document.getElementById('choiceHolder').textContent = symbol;
      const feedback = document.getElementById('feedbackMsg');
      const rabbit = document.getElementById('rabbit');

      if (symbol === q.ans) {
        // Correct Answer
        score++;
        document.getElementById('scoreDisplay').textContent = score;
        feedback.textContent = 'إجابة صحيحة! ممتاز 👏';
        feedback.className = 'feedback-msg feedback-correct';
        playSound('correct');

        // Rabbit jump animation
        rabbit.classList.add('jump');
        setTimeout(() => rabbit.classList.remove('jump'), 600);

        setTimeout(() => {
          currentQuestionIndex++;
          if (currentQuestionIndex < questionsData.length) {
            updateRabbitPosition(currentQuestionIndex);
            loadQuestion();
          } else {
            updateRabbitPosition(questionsData.length - 1);
            showFinalCelebration();
          }
        }, 1200);

      } else {
        // Wrong Answer
        feedback.textContent = 'محاولة خاطئة، فكر مجدداً! 🤔';
        feedback.className = 'feedback-msg feedback-wrong';
        playSound('wrong');

        setTimeout(() => {
          document.getElementById('choiceHolder').textContent = '؟';
          feedback.textContent = '';
          btns.forEach(btn => btn.disabled = false);
        }, 1300);
      }
    }

    function showFinalCelebration() {
      playSound('win');
      const studentName = document.getElementById('studentName').value.trim() || 'يا بطل';
      document.getElementById('congratsText').textContent = `🏆 رائع جداً يا ${studentName}! لقد ساعدت الأرنب على الوصول للجزرة! 🥕`;
      document.getElementById('finalScore').textContent = score;
      
      const modal = document.getElementById('celebrationModal');
      modal.classList.add('active');
      startFireworks();
    }

    function restartGame() {
      currentQuestionIndex = 0;
      score = 0;
      document.getElementById('scoreDisplay').textContent = '0';
      document.getElementById('celebrationModal').classList.remove('active');
      setupTrack();
      loadQuestion();
    }

    // Fireworks Canvas Animation
    function startFireworks() {
      const canvas = document.getElementById('fireworks-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;

      let particles = [];
      const colors = ['#ff1744', '#f50057', '#d500f9', '#651fff', '#3d5aff', '#00e5ff', '#1de9b6', '#00e676', '#ffea00', '#ff9100'];

      function createFirework() {
        const x = Math.random() * canvas.width;
        const y = Math.random() * (canvas.height * 0.6);
        const color = colors[Math.floor(Math.random() * colors.length)];
        for (let i = 0; i < 35; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 4 + 1;
          particles.push({
            x: x,
            y: y,
            dx: Math.cos(angle) * speed,
            dy: Math.sin(angle) * speed,
            color: color,
            alpha: 1,
            decay: Math.random() * 0.02 + 0.015
          });
        }
      }

      let fireworkInterval = setInterval(createFirework, 300);

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach((p, i) => {
          p.x += p.dx;
          p.y += p.dy;
          p.alpha -= p.decay;
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
          ctx.fill();

          if (p.alpha <= 0) {
            particles.splice(i, 1);
          }
        });

        if (document.getElementById('celebrationModal').classList.contains('active')) {
          requestAnimationFrame(render);
        } else {
          clearInterval(fireworkInterval);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      render();
    }

    // Initialize Game on Load
    window.onload = function() {
      setupTrack();
      loadQuestion();
    };
  </script>
</body>
</html>
